apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incident-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "incident-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "incident-service.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "incident-service.name" . }}
    spec:
      containers:
        - name: incident-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.datasourceUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.env.datasourceUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.datasourcePasswordKey }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.kafkaBootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.env.schemaRegistryUrl | quote }}
            - name: INCIDENT_DETECTED_TOPIC
              value: {{ .Values.env.detectedTopic | quote }}
            - name: INCIDENT_UPDATED_TOPIC
              value: {{ .Values.env.updatedTopic | quote }}
            - name: INVESTIGATION_REQUESTED_TOPIC
              value: {{ .Values.env.investigationRequestedTopic | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
