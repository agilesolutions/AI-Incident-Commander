spring:
  application:
    name: incident-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/incidentdb}
    username: ${SPRING_DATASOURCE_USERNAME:incident}
    password: ${SPRING_DATASOURCE_PASSWORD:incident}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}

incident:
  detected-topic: ${INCIDENT_DETECTED_TOPIC:incident.detected.v1}
  updated-topic: ${INCIDENT_UPDATED_TOPIC:incident.updated.v1}
  investigation-requested-topic: ${INVESTIGATION_REQUESTED_TOPIC:incident.investigation.requested.v1}
  consumer-group: ${INCIDENT_CONSUMER_GROUP:incident-service}
  schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}

server:
  port: 8080
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}