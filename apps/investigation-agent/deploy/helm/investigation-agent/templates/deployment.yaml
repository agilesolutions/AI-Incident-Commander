apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: investigation-agent
  template:
    metadata:
      labels:
        app: investigation-agent
    spec:
      containers:
        - name: investigation-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.datasourceUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.env.datasourceUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.datasourcePasswordKey }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.kafkaBootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.env.schemaRegistryUrl | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.env.ollamaBaseUrl | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.env.ollamaModel | quote }}
            - name: INVESTIGATION_ENGINE
              value: {{ .Values.env.engine | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
