spring:
  application:
    name: investigation-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investigationdb}
    username: ${SPRING_DATASOURCE_USERNAME:investigation}
    password: ${SPRING_DATASOURCE_PASSWORD:investigation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.1

investigation:
  engine: ${INVESTIGATION_ENGINE:ollama}
  requested-topic: ${INVESTIGATION_REQUESTED_TOPIC:incident.investigation.requested.v1}
  completed-topic: ${INVESTIGATION_COMPLETED_TOPIC:incident.investigation.completed.v1}
  consumer-group: ${INVESTIGATION_CONSUMER_GROUP:investigation-agent}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  model: ${OLLAMA_MODEL:qwen2.5:7b}
  max-evidence-items: 100
  max-prompt-chars: 24000
  max-attempts: 3
  retry-delay-ms: 3000
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
