server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: command-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: AI Incident Commander Command API
    version: 0.1.0-SNAPSHOT

commander:
  services:
    incident:
      base-url: ${INCIDENT_SERVICE_BASE_URL:http://localhost:8081}
    remediation:
      base-url: ${REMEDIATION_SERVICE_BASE_URL:http://localhost:8082}
