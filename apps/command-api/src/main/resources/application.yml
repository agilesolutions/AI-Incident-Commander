server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: command-api

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: AI Incident Commander Command API
    version: 0.1.0-SNAPSHOT

commander:
  services:
    incident:
      base-url: ${INCIDENT_SERVICE_BASE_URL:http://localhost:8081}
    remediation:
      base-url: ${REMEDIATION_SERVICE_BASE_URL:http://localhost:8082}
