spring:
  application: { name: remediation-service }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remediationdb}
    username: ${SPRING_DATASOURCE_USERNAME:remediation}
    password: ${SPRING_DATASOURCE_PASSWORD:remediation}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway: { enabled: true }
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer.enable-auto-commit: false
    producer.acks: all
    producer.properties.enable.idempotence: true
server:
  port: 8080
  shutdown: graceful
remediation:
  approved-topic: ${REMEDIATION_APPROVED_TOPIC:incident.remediation.approved.v1}
  rejected-topic: ${REMEDIATION_REJECTED_TOPIC:incident.remediation.rejected.v1}
  executed-topic: ${REMEDIATION_EXECUTED_TOPIC:incident.remediation.executed.v1}
  failed-topic: ${REMEDIATION_FAILED_TOPIC:incident.remediation.failed.v1}
  verified-topic: ${REMEDIATION_VERIFIED_TOPIC:incident.remediation.verified.v1}
  consumer-group: ${REMEDIATION_CONSUMER_GROUP:remediation-service}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  execution-mode: ${REMEDIATION_EXECUTION_MODE:simulation}
  verification-mode: ${REMEDIATION_VERIFICATION_MODE:manual}
  outbox-poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
  allowed-namespaces: ${REMEDIATION_ALLOWED_NAMESPACES:default,demo}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
