spring:
  application:
    name: chaos-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SKAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
        auto.register.schemas: ${SCHEMA_REGISTRY_AUTO_REGISTER:true}
        specific.avro.reader: false
server:
  port: ${SERVER_PORT:8080}

simulator:
  enabled: ${SIMULATOR_ENABLED:false}
  interval-ms: ${SIMULATOR_INTERVAL_MS:30000}
  source: ${SIMULATOR_SOURCE:chaos-simulator}
  environment: ${SIMULATOR_ENVIRONMENT:demo}
  topic: ${SIMULATOR_TOPIC:incident.telemetry.v1}

management:
  observations:
    annotations:
      enabled=true:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOG_LEVEL:INFO}
    org.flywaydb: ${LOG_LEVEL:INFO}
    org.springframework.boot.autoconfigure.flyway: ${LOG_LEVEL:INFO}
    org.springframework.boot.jdbc.autoconfigure: ${LOG_LEVEL:INFO}
    org.springframework.boot.hibernate.autoconfigure: ${LOG_LEVEL:INFO}