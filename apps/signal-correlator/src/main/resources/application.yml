spring:
  application:
    name: signal-correlator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:signal-correlator}
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8080}

correlator:
  input-topic: ${CORRELATOR_INPUT_TOPIC:incident.telemetry.v1}
  output-topic: ${CORRELATOR_OUTPUT_TOPIC:incident.detected.v1}
  detector-id: ${CORRELATOR_DETECTOR_ID:signal-correlator-v1}
  threshold: ${CORRELATOR_THRESHOLD:3}
  window-seconds: ${CORRELATOR_WINDOW_SECONDS:120}
  deduplication-ttl-seconds: ${CORRELATOR_DEDUP_TTL_SECONDS:900}
  environment: ${CORRELATOR_ENVIRONMENT:}

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}

info:
  app:
    name: Signal Correlator
    description: Deterministic telemetry correlation and incident detection
    version: 0.1.0-SNAPSHOT
