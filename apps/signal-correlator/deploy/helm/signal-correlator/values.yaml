replicaCount: 1
image:
  repository: signal-correlator
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  kafkaBootstrapServers: kafka.messaging.svc.cluster.local:9092
  schemaRegistryUrl: http://schema-registry.messaging.svc.cluster.local:8081
  inputTopic: incident.telemetry.v1
  outputTopic: incident.detected.v1
  threshold: "3"
  windowSeconds: "120"
  deduplicationTtlSeconds: "900"
