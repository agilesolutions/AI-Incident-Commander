apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "signal-correlator.fullname" . }}
  namespace: {{ .Values.namespace.name }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.SPRING_PROFILES_ACTIVE | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.bootstrapServers | quote }}
  SCHEMA_REGISTRY_URL: {{ .Values.config.schemaRegistryUrl | quote }}
  CORRELATOR_INPUT_TOPIC: {{ .Values.config.inputTopic | quote }}
  CORRELATOR_OUTPUT_TOPIC: {{ .Values.config.outputTopic | quote }}
  CORRELATOR_THRESHOLD: {{ .Values.config.threshold | quote }}
  CORRELATOR_WINDOW_SECONDS: {{ .Values.config.windowSeconds | quote }}
  CORRELATOR_DEDUP_TTL_SECONDS: {{ .Values.config.deduplicationTtlSeconds | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT | quote }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT | quote }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.OTEL_TRACES_SAMPLER_ARG | quote }}

